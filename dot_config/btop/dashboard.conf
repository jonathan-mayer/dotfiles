#? Config file for btop v. 1.4.7
#? Dedicated dashboard preset for the dedicated mini monitor (HDMI-A-3, 960x640).
#? Managed by chezmoi - btop is launched with `btop --config ~/.config/btop/dashboard.conf`
#? so this never interferes with ~/.config/btop/btop.conf

color_theme = "Default"
theme_background = true
truecolor = true
force_tty = false
disable_presets = "Off"
presets = "cpu:0:default,mem:0:default"
vim_keys = false
disable_mouse = false
rounded_corners = true
terminal_sync = true
graph_symbol = "braille"
graph_symbol_cpu = "default"
graph_symbol_gpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"

#* Compact layout for the small screen: cpu + mem only
shown_boxes = "cpu mem"
update_ms = 2000

proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = false
proc_info_smaps = false
proc_left = false
proc_filter_kernel = true
proc_follow_detailed = true
proc_aggregate = false
keep_dead_proc_usage = false

cpu_graph_upper = "total"
cpu_graph_lower = "Auto"
show_gpu_info = "Auto"
cpu_invert_lower = true
cpu_single_graph = true
cpu_bottom = false
show_uptime = true
show_cpu_watts = true
check_temp = true
cpu_sensor = "Auto"
show_coretemp = false
cpu_core_map = ""
temp_scale = "celsius"
base_10_sizes = false
show_cpu_freq = true
freq_mode = "first"
clock_format = "%X"
background_update = true
custom_cpu_name = ""

disks_filter = ""
mem_graphs = true
mem_below_net = false
zfs_arc_cached = true
show_swap = false
swap_disk = false
show_disks = false
only_physical = true
use_fstab = true
zfs_hide_datasets = false
disk_free_priv = false
show_io_stat = false
io_mode = false
io_graph_combined = false
io_graph_speeds = ""
swap_upload_download = false

net_download = 100
net_upload = 100
net_auto = true
net_sync = true
net_iface = ""
base_10_bitrate = "Auto"

show_battery = false
selected_battery = "Auto"
show_battery_watts = false

log_level = "WARNING"

#* Keep this file exactly as chezmoi renders it
save_config_on_exit = false

nvml_measure_pcie_speeds = false
rsmi_measure_pcie_speeds = false
gpu_mirror_graph = true
shown_gpus = "nvidia amd intel apple"
custom_gpu_name0 = ""
custom_gpu_name1 = ""
custom_gpu_name2 = ""
custom_gpu_name3 = ""
custom_gpu_name4 = ""
custom_gpu_name5 = ""
